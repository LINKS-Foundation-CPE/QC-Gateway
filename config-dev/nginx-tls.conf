# TLS-terminating proxy for the dev stack (docker-compose.dev.yaml).
# One self-signed cert (shared with the dev Keycloak) terminates HTTPS for
# every published port; upstream services stay plain HTTP inside the compose
# network. Upstreams are resolved per-request (resolver + variable) so nginx
# starts even when optional services (dashboard profile) are absent.

worker_processes 1;

events {
  worker_connections 1024;
}

http {
  resolver 127.0.0.11 valid=10s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  ssl_certificate     /certs/keycloak.crt;
  ssl_certificate_key /certs/keycloak.key;

  client_max_body_size 200m;

  # QC Gateway
  server {
    listen 8000 ssl;
    location / {
      set $up http://fastapi-proxy:8000;
      proxy_pass $up;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 300s;
    }
  }

  # quantum-dashboard (vite dev server, optional profile) — websocket for HMR
  server {
    listen 8080 ssl;
    location / {
      set $up http://dashboard:8080;
      proxy_pass $up;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
    }
  }

  # Object store console (RustFS)
  server {
    listen 8901 ssl;
    location / {
      set $up http://rustfs:9001;
      proxy_pass $up;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }

  # Jobs results portal (static)
  server {
    listen 8940 ssl;
    location / {
      set $up http://jobs-portal:80;
      proxy_pass $up;
      proxy_set_header Host $http_host;
    }
  }

  # Object store S3 API (RustFS)
  server {
    listen 9000 ssl;
    location / {
      set $up http://rustfs:9000;
      proxy_pass $up;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
