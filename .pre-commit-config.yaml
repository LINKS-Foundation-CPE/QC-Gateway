repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # mypy runs on the whole middleware package so cross-module checks work.
  # TEMPORARY: non-blocking (`|| true`) while the ~54 pre-existing type errors
  # are paid down. Once `mypy` is clean, drop the wrapper and restore the
  # upstream mirrors-mypy hook so type errors block commits again.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (non-blocking)
        entry: bash -c 'mypy --config-file=pyproject.toml middleware || true'
        language: python
        additional_dependencies:
          - mypy==1.13.0
          - pydantic-settings
          - types-requests
          - types-redis
        pass_filenames: false
        always_run: true
