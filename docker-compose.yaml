x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "30"

services:
  reporter:
    build: .
    image: fastapi-middleware:latest
    container_name: job-reporter
    command: ["python", "-u", "-m", "middleware.job_reporter"]
    environment:
      - TZ=Europe/Rome
      - VENDOR_PLUGIN=iqm
      - SITE_PLUGIN=spark
      - POSTGRES_DB=jobproxy
      - POSTGRES_USER=jobproxy
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - PORTAL_API_HOST=http://host.docker.internal:8500
      # Parametri runtime del reporter
      - JOB_REPORTER_INTERVAL=10
      - JOB_REPORTER_HTTP_TIMEOUT=30
      - JOB_REPORTER_VERIFY_TLS=false
      - JOB_REPORTER_MAX_ERRORS=50
      - JOB_REPORTER_BACKOFF_FACTOR=2.0
      - JOB_REPORTER_MAX_BACKOFF=300
      # Redis config
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging: *default-logging
    labels:
      - "loki.job=job-reporter"

  # Calibration reports, and the day-by-day index of them. Same image as the
  # reporter, a different entry point: it was split out of the reporter when the
  # machine began requiring an administrator token for its calibration
  # endpoints, so that token (ADMIN_IQM_TOKEN in .env) is held by this container
  # alone. Without it, calibration falls back to IQM_SERVER_TOKEN, as before.
  calibration-poller:
    build: .
    image: fastapi-middleware:latest
    container_name: calibration-poller
    command: ["python", "-u", "-m", "middleware.calibration_poller"]
    environment:
      - TZ=Europe/Rome
      - VENDOR_PLUGIN=iqm
      - SITE_PLUGIN=spark
      - POSTGRES_DB=jobproxy
      - POSTGRES_USER=jobproxy
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - JOB_REPORTER_HTTP_TIMEOUT=120
      - JOB_REPORTER_VERIFY_TLS=false
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    labels:
      - "loki.job=calibration-poller"

  swag:
    image: lscr.io/linuxserver/swag:4.2.0
    container_name: nginx-certbot
    cap_add:
      - NET_ADMIN
    network_mode: host
    environment:
      - TZ=Europe/Rome
      - PUID=1000
      - PGID=1000
      - VALIDATION=http
    env_file:
      - .env
    volumes:
      - ./config:/config
      - ../quantum-dashboard/dashboard:/dashboard:ro
      - ./middleware/vendors/iqm/jobs-portal:/jobs-portal:ro
    # ports:
    #   - 0.0.0.0:443:443
    #   - 0.0.0.0:80:80
    restart: unless-stopped
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    logging: *default-logging
    labels:
      - "loki.job=nginx-certbot"

  fastapi-proxy:
    build: .
    image: fastapi-middleware:latest
    container_name: fastapi-middleware
    environment:
      - TZ=Europe/Rome
      - VENDOR_PLUGIN=iqm
      - SITE_PLUGIN=spark
      - KEYCLOAK_ISSUER=${AUTH_URL}/realms/cortex
      - KEYCLOAK_JWKS_URL=${AUTH_URL}/realms/cortex/protocol/openid-connect/certs
      - AUDIENCE=account
      - LOG_LEVEL=INFO
      - POSTGRES_DB=jobproxy
      - POSTGRES_USER=jobproxy
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - PORTAL_API_HOST=http://host.docker.internal:8500
      - MIDDLEWARE_MODE=${MIDDLEWARE_MODE}  # Can be production, authentication, or maintenance
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      # Limit per-user concurrent shots
      - MAX_CONCURRENT_SHOTS=2500000
    env_file:
      - .env
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging: *default-logging
    labels:
      - "loki.job=fastapi-proxy"

  postgres:
    image: postgres:17
    container_name: jobs-local-db
    restart: always
    environment:
      TZ: Europe/Rome
      POSTGRES_DB: jobproxy
      POSTGRES_USER: jobproxy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobproxy -d jobproxy"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging
    labels:
      - "loki.job=job-reporter-postgres"

  # The object store. RustFS speaks the same S3 API and reads the same
  # MINIO_ROOT_* credentials, so nothing that talks to it changes.
  rustfs:
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    container_name: rustfs-job-data
    restart: always
    environment:
      - TZ=Europe/Rome
    env_file:
      - .env
    ports:
      - "127.0.0.1:9001:9001"
      - "127.0.0.1:9000:9000"
    volumes:
      - ${MINIO_STORAGE_PATH}/rustfs:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 20s
      timeout: 20s
      retries: 3
    depends_on:
      rustfs-data-owner:
        condition: service_completed_successfully
    labels:
      - "loki.job=rustfs-job-data"
    logging: *default-logging

  # RustFS runs as uid 10001; a data directory Docker creates on first start
  # is root's. Only the top directory: everything below it is RustFS's own.
  rustfs-data-owner:
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    user: "0:0"
    entrypoint: ["chown", "10001:10001", "/data"]
    volumes:
      - ${MINIO_STORAGE_PATH}/rustfs:/data
    restart: "no"
    logging: *default-logging

  rustfs-init:
    build: ./rustfs-init
    container_name: rustfs-init
    environment:
      - TZ=Europe/Rome
      - STORE_ENDPOINT=http://rustfs:9000
    env_file:
      - .env
    volumes:
      # Read-only, to tell MinIO's leftover data from a never-migrated bucket.
      - ${MINIO_STORAGE_PATH}:/storage:ro
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: jobs-redis
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    environment:
      - TZ=Europe/Rome
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging
    labels:
      - "loki.job=redis"

  restic:
    image: ghcr.io/lobaro/restic-backup-docker:v1.4.0
    container_name: restic-minio
    restart: always
    privileged: true
    volumes:
      - ${MINIO_STORAGE_PATH}/rustfs:/data/rustfs:ro
      - ${MINIO_STORAGE_PATH}/restore:/restore
    environment:
      - TZ=Europe/Rome
      - RESTIC_REPOSITORY=s3:https://${BACKUP_ENDPOINT}/spark-job-store
      - BACKUP_CRON=0 1 * * *
      - RESTIC_INIT_ARGS=--insecure-tls --insecure-no-password
      - RESTIC_JOB_ARGS=--insecure-tls --insecure-no-password
      - RESTIC_DATA_SUBSET=2G                            
      - RESTIC_FORGET_ARGS=--prune --keep-last 7 --insecure-tls --insecure-no-password
    env_file:
      - .env
    labels:
      - "loki.job=restic-minio"

  volumes-backup:
    image: offen/docker-volume-backup:v2.43.3
    restart: always
    env_file:
      - .env
    environment:
      - TZ=Europe/Rome
      - BACKUP_CRON_EXPRESSION=0 3 * * *
      - BACKUP_FILENAME=spark_jobs_db-%Y-%m-%dT%H-%M-%S.{{ .Extension }}
      - AWS_S3_BUCKET_NAME=jobs-db-backup
      - AWS_ENDPOINT=${BACKUP_ENDPOINT}
      - AWS_ENDPOINT_PROTO=https
      - AWS_ENDPOINT_INSECURE=true
      - BACKUP_RETENTION_DAYS=30
    volumes:
      - postgres_data:/backup/postgres_data:ro


volumes:
  postgres_data:
  redis_data: